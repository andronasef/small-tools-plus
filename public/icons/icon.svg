<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Blue Squircle fills the icon canvas (standard iOS / PWA radius) -->
  <rect width="512" height="512" rx="112" fill="url(#brandGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Minimalist Tool & Plus Glyphs -->
  <g fill="#ffffff">
    <!-- Grid blocks -->
    <rect x="106" y="106" width="124" height="124" rx="30" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="282" y="106" width="124" height="124" rx="30" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="106" y="282" width="124" height="124" rx="30" fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Plus Sign (+) in bottom right cell -->
    <g transform="translate(344, 344)">
      <rect x="-14" y="-60" width="28" height="120" rx="14" fill="#93c5fd"/>
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#93c5fd"/>
      <circle cx="0" cy="0" r="16" fill="#ffffff"/>
    </g>
  </g>
</svg>
